html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E9EDF2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#0B1F3A}
a{color:inherit;text-decoration:none}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#F3F5F8;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.hd{background:#0B1F3A;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
.hd .ttl{font-size:22px;font-weight:700;line-height:1.15}
.hd .sub{font-size:12px;color:#C3CEDD;margin-top:3px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{width:38px;height:38px;border-radius:10px;background:#F5A524;display:flex;align-items:center;justify-content:center}

.rbtn,.me,.iconbtn{position:relative;height:44px;border-radius:22px;border:0;background:#163058;color:#fff;display:flex;align-items:center;justify-content:center}
.rbtn,.iconbtn{width:44px}
.me{padding:0 12px 0 6px;gap:8px;font-size:13px;font-weight:600}
.av{width:32px;height:32px;border-radius:16px;background:#F5A524;color:#0B1F3A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;border-radius:9px;background:#F5A524;color:#0B1F3A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.body{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:10px 10px 8px}
.tile b{display:block;font-size:22px;line-height:1.1}.tile span{font-size:11px;color:#5B6778}
.tile.red{background:#FDECEA;border-color:#F3C2BC}.tile.red b,.tile.red span{color:#8F1B11}
.search{display:flex;align-items:center;gap:10px;height:46px;background:#fff;border:1px solid #D5DCE5;border-radius:12px;padding:0 14px;color:#5B6778}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid #D5DCE5;background:#fff;font-size:13px;font-weight:500}
.chip.on{background:#0B1F3A;border-color:#0B1F3A;color:#fff;font-weight:600}
.seg{display:flex;background:#E3E8EE;border-radius:12px;padding:3px}
.seg button{flex:1;height:38px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:500;color:#3B4658}
.seg button.on{background:#fff;color:#0B1F3A;font-weight:700}
.card{background:#fff;border:1px solid #E3E8EE;border-radius:14px}
.ac{display:flex;overflow:hidden}.ac>i{width:6px;flex:none}.ac .in{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.big{font-size:17px}.mut{color:#5B6778;font-size:13px}

.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.aog{background:#B42318;color:#fff}.pill.ltd{background:#FFF0CC;color:#6B4000}.pill.ok{background:#E2F3E9;color:#0C5C34}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:700;flex:none}
.tag.hi{background:#B42318;color:#fff}.tag.md{background:#FFF0CC;color:#6B4000}.tag.lo{background:#E8ECF1;color:#3B4658}
.srow{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.srow .t{font-size:15px;font-weight:600;line-height:1.3}

.sec{padding:12px 14px}
.sec h3{margin:0 0 4px;font-size:15px}.sec h3 small{color:#5B6778;font-weight:500;font-size:15px}
.line{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid #EDF0F4;padding-top:8px;margin-top:6px}

.link{font-size:13px;font-weight:600;text-decoration:underline;background:none;border:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#E3E8EE;border:1px solid #E3E8EE;border-radius:14px;overflow:hidden}
.stats div{background:#fff;padding:10px 12px}.stats small{display:block;font-size:11px;color:#5B6778}.stats b{display:block;font-size:14px;margin-top:3px}
.back{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.pbar i{height:6px;border-radius:3px;background:#D5DCE5}.pbar i.f{background:#0B1F3A}

.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #DDE3EA;display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .btn{flex:1;display:flex;align-items:center;justify-content:center}
nav.bar{padding:6px 6px calc(8px + env(safe-area-inset-bottom));gap:0;height:auto}

nav a.add{color:#0B1F3A;font-weight:700}
label.f{display:block;font-size:12px;font-weight:700;color:#3B4658;margin-bottom:5px}
.in1,select.in1,textarea.in1{width:100%;height:48px;border:1px solid #C9D1DC;border-radius:12px;background:#fff;padding:0 12px;font-size:15px}
textarea.in1{height:88px;padding:10px 12px;line-height:1.4;resize:none}
.two{display:flex;gap:10px}.two>div{flex:1}
.pri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pri button{height:46px;border-radius:12px;border:1px solid #C9D1DC;background:#fff;font-size:14px;font-weight:500}
.pri button.on{background:#0B1F3A;border-color:#0B1F3A;color:#fff;font-weight:700}
.pri button.on.hi{background:#B42318;border-color:#B42318}
.sw{position:relative;width:48px;height:28px;display:inline-block;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2}
.sw span{position:absolute;inset:0;background:#9AA6B6;border-radius:14px}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff}
.sw input:checked+span{background:#0B1F3A}.sw input:checked+span:after{left:23px;background:#F5A524}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:calc(33.3% - 6px);height:76px;border-radius:12px;background:#DDE3EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:#3B4658;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.add{background:transparent;border:2px dashed #9AA6B6;color:#0B1F3A;cursor:pointer}
.log{display:flex;gap:10px;margin-top:10px}.log i{width:8px;height:8px;border-radius:4px;background:#0B1F3A;margin-top:6px;flex:none}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week div{background:#fff;border:1px solid #E3E8EE;border-radius:12px;padding:8px 0 6px;text-align:center;font-size:11px;color:#5B6778}
.week div b{display:block;font-size:16px;color:#0B1F3A}.week div u{display:block;width:6px;height:6px;border-radius:3px;background:#0B1F3A;margin:3px auto 0}.week div s{display:block;height:9px}
.week div.t{background:#0B1F3A;color:#fff}.week div.t b{color:#fff}.week div.t u{background:#F5A524}
.dcard{padding:12px 14px;display:flex;flex-direction:column;gap:8px}.dcard.od{background:#FDECEA;border-color:#F3C2BC}
.dbar{height:6px;border-radius:3px;background:#D5DCE5}.dbar i{display:block;height:6px;border-radius:3px}
.empty{text-align:center;color:#5B6778;padding:30px 10px;font-size:14px}
.note{font-size:12px;color:#5B6778;text-align:center;padding:14px 16px 0}
.ov{position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.sheet h2{margin:0;font-size:18px}
.opt{display:flex;align-items:center;gap:10px;height:52px;border:1px solid #D5DCE5;border-radius:12px;background:#fff;padding:0 14px;font-size:15px;font-weight:500;width:100%;text-align:left}
.opt.on{border-color:#0B1F3A;background:#FCE9C2;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0B1F3A;color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25)}

</style>

  else if (r === 'snag') out = vSnag(p[1]);
  else if (r === 'add') out = vAdd(p[1]);
  else if (r === 'parts') out = vParts();
  else if (r === 'due') out = vDue();
  else if (r === 'alerts') out = vAlerts();
  else out = vFleet();
  $('#app').innerHTML = out.html + (out.tab === 'x' ? '' : nav(out.tab));
  if (out.after) out.after();
  if (key !== lastRoute) { window.scrollTo(0, 0); lastRoute = key; closeModal(); }
}
window.addEventListener('hashchange', render);

/* ---------- actions ---------- */
function engSheet() {
  modal('<h2>Who is using the app?</h2>' + S.engs.map(function (n) { return '<button class="opt' + (n === S.me ? ' on' : '') + '" data-act="pick" data-v="' + esc(n) + '"><span class="av">' + esc(ini(n)) + '</span>' + esc(n) + '</button>'; }).join('') +
    '<div class="two"><div><label class="f" for="newEng">Add a name</label><input id="newEng" class="in1" type="text" maxlength="30" placeholder="e.g. P. Mondlane"></div><div style="flex:none;align-self:flex-end"><button class="btn" data-act="addEng">Add</button></div></div><button class="btn o" data-act="close">Close</button>');
}
function updSheet(id) {
  var s = S.snags.filter(function (x) { return x.id === id; })[0]; if (!s) return;
  modal('<h2>Update ' + esc(s.id) + '</h2><div><label class="f" for="upNote">Note</label><textarea id="upNote" class="in1" placeholder="What was done or found?"></textarea></div><div><label class="f" for="upSt">Status</label><select id="upSt" class="in1">' + ['Open', 'Awaiting part', 'Deferred', 'Closed'].map(function (x) { return '<option' + (x === s.st ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div><div class="mut" style="font-size:12px">Signed by <b style="color:#0B1F3A">' + esc(S.me) + '</b></div><button class="btn" data-act="saveUpd" data-id="' + esc(id) + '">Save update</button><button class="btn o" data-act="close">Cancel</button>');
}
function advSheet(i) {
  var p = S.parts[i]; if (!p) return;
  var nx = p.stage + 1; if (nx > 3) return;
  modal('<h2>' + esc(p.desc) + '</h2><div class="mut">' + esc(p.pn) + ' · ' + p.ac + '</div><div style="font-size:15px">Move from <b>' + STAGES[p.stage] + '</b> to <b>' + STAGES[nx] + '</b>?</div>' + (nx < 3 ? '<div><label class="f" for="etaIn">ETA (optional)</label><input id="etaIn" class="in1" type="text" maxlength="20" placeholder="e.g. 12 Nov" value="' + esc(p.eta) + '"></div>' : '') + '<button class="btn" data-act="doAdv" data-i="' + i + '">Move to ' + STAGES[nx] + '</button><button class="btn o" data-act="close">Cancel</button>');
}
function val(id) { var e = $('#' + id); return e ? e.value.trim() : ''; }

document.addEventListener('click', function (e) {
  var m = $('#modal');
  if (e.target === m) { closeModal(); return; }
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), id = el.getAttribute('data-id');
  if (act === 'f') { F[el.getAttribute('data-k')] = v; render(); }
  else if (act === 'eng') engSheet();
  else if (act === 'close') closeModal();
  else if (act === 'pick') { S.me = v; save(); closeModal(); render(); toast('Signed in as ' + v); }
  else if (act === 'addEng') { var n = val('newEng'); if (!n) return; if (S.engs.indexOf(n) < 0) S.engs.push(n); S.me = n; save(); closeModal(); render(); toast('Added ' + n); }
  else if (act === 'seeSnags') { F.sac = v; F.seg = 'open'; F.sf = 'all'; location.hash = '#/snags'; }
  else if (act === 'clearAc') { F.sac = ''; render(); }
  else if (act === 'reset') { if (confirm('Reset all sample data on this phone?')) { S = seed(); save(); PH = {}; render(); toast('Sample data reset'); } }
  else if (act === 'pri') { addPri = v; [].forEach.call($('#priG').children, function (b) { b.className = (b.getAttribute('data-v') === v ? 'on ' : '') + (b.getAttribute('data-v') === 'High' || b.getAttribute('data-v') === 'AOG' ? 'hi' : ''); }); }
  else if (act === 'upd') updSheet(id);
  else if (act === 'saveUpd') {
    var s = S.snags.filter(function (x) { return x.id === id; })[0]; if (!s) return;
    var note = val('upNote'), st = val('upSt'), txt = note || ('Status set to ' + st);
    if (st !== s.st) { s.st = st; if (!note) txt = 'Status set to ' + st; else txt = note + ' (status: ' + st + ')'; }
    if (st === 'Closed') txt += ' · closed by ' + S.me;
    s.log.push({ t: Date.now(), who: S.me, text: txt });
    if (st === 'Closed' && s.pri === 'AOG') { var other = S.snags.some(function (x) { return x.ac === s.ac && x.id !== s.id && x.pri === 'AOG' && x.st !== 'Closed'; }); var a = S.ac.filter(function (x) { return x.reg === s.ac; })[0]; if (a && !other && a.st === 'AOG') a.st = 'Limited'; }
    save(); closeModal(); render(); toast('Snag updated');
  }
  else if (act === 'adv') advSheet(Number(el.getAttribute('data-i')));
  else if (act === 'doAdv') {
    var p = S.parts[Number(el.getAttribute('data-i'))]; if (!p) return;
    p.stage += 1; var eta = $('#etaIn'); if (eta) p.eta = eta.value.trim();
    addAlert('Part ' + STAGES[p.stage].toLowerCase() + ': ' + p.desc + (p.stage < 3 && p.eta ? ', ETA ' + p.eta : ''));
    var sn = S.snags.filter(function (x) { return x.id === p.snag; })[0];
    if (sn) { sn.log.push({ t: Date.now(), who: S.me, text: 'Part ' + STAGES[p.stage].toLowerCase() + ': ' + p.desc }); if (p.stage === 3 && sn.st === 'Awaiting part' && !S.parts.some(function (x) { return x.snag === sn.id && x.stage < 3; })) sn.st = 'Open'; }
    save(); closeModal(); render(); toast('Part moved to ' + STAGES[p.stage]);
  }
  else if (act === 'saveAdd') {
    var title = val('fTtl'); if (!title) { toast('Please enter a short title'); var t = $('#fTtl'); if (t) t.focus(); return; }
    var reg = val('fAc'), sid = 'S-' + ('000' + S.seq++).slice(-4), need = $('#needPart') && $('#needPart').checked, pn = val('fPn'), pd = val('fPd');
    var snag = { id: sid, ac: reg, ata: val('fAta'), title: title, pri: addPri, st: need ? 'Awaiting part' : 'Open', by: S.me, ts: Date.now(), desc: val('fDesc'), photos: ADDPH.length, log: [{ t: Date.now(), who: S.me, text: 'Snag reported' }] };
    S.snags.unshift(snag); PH[sid] = ADDPH.slice();
    if (need) S.parts.push({ pn: pn || 'TBC', desc: pd || title, qty: Math.max(1, Number(val('fQty')) || 1), ac: reg, snag: sid, stage: 0, eta: '' });
    if (addPri === 'AOG') { var ac = S.ac.filter(function (x) { return x.reg === reg; })[0]; if (ac) ac.st = 'AOG'; }
    addAlert('New snag ' + sid + ' on ' + reg + ': ' + title);
    save(); location.hash = '#/snag/' + sid; toast('Snag saved');
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { F.q = e.target.value; var l = $('#list'); if (l) l.innerHTML = fleetCards(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'needPart') { var b = $('#partBox'); b.hidden = !t.checked; b.style.display = t.checked ? 'flex' : 'none'; }
  else if (t.id === 'phAdd') {
    [].forEach.call(t.files, function (f) { ADDPH.push(URL.createObjectURL(f)); });
    $('#addTh').innerHTML = ADDPH.map(function (u) { return '<div class="ph"><img alt="Photo" src="' + u + '"></div>'; }).join(''); t.value = '';
  }
  else if (t.id === 'ph') {
    var sid = location.hash.split('/')[2], s = S.snags.filter(function (x) { return x.id === sid; })[0]; if (!s) return;
    PH[sid] = PH[sid] || [];
    [].forEach.call(t.files, function (f) { PH[sid].push(URL.createObjectURL(f)); s.photos += 1; });
    s.log.push({ t: Date.now(), who: S.me, text: 'Photo added' });
    save(); render(); toast('Photo added');
  }
});
render();
})();
</script>
</body>
</html>
